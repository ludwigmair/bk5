name: Deploy staging per SFTP

# Wird NUR getriggert, wenn eine Änderung auf den staging-Branch kommt.
# Der Workflow prüft anschließend, ob dieser Push ein Merge von develop
# in staging ist – nur dann wird per SFTP zum Host deployed.
on:
  push:
    branches:
      - staging
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Keine Credentials irgendwo im Repo: alles kommt aus GitHub-Secrets
    # (einstellbar unter Settings → Secrets and variables → Actions):
    # FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, FTP_TARGET_DIR,
    # BACKUP_URL, BACKUP_TOKEN – optional ADMIN_USERS (nur für den Erst-Deploy,
    # siehe Schritt ".env auf dem Server anlegen").
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_TARGET_DIR: ${{ secrets.FTP_TARGET_DIR }}
      BACKUP_URL: ${{ secrets.BACKUP_URL }}
      BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}
      ADMIN_USERS: ${{ secrets.ADMIN_USERS }}
    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          ref: staging
          # Komplette History, damit wir Merge-Eltern prüfen können
          fetch-depth: 0

      - name: Nur bei develop→staging-Merge deployen
        id: check-merge
        run: |
          PARENTS="$(git log --format=%P -1 "$GITHUB_SHA")"
          PARENT_COUNT="$(echo "$PARENTS" | wc -w | tr -d ' ')"

          if [ "$PARENT_COUNT" -lt 2 ]; then
            echo "Kein Merge-Commit (${PARENT_COUNT} Eltern) – Abbruch."
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Ist einer der beiden Eltern der develop-Branch?
          DEVELOP="$(
            git rev-parse origin/develop 2>/dev/null \
              || git rev-parse refs/remotes/origin/develop 2>/dev/null \
              || echo ""
          )"

          if [ -n "$DEVELOP" ] && echo "$PARENTS" | grep -q "$DEVELOP"; then
            echo "Merge von develop in staging erkannt – deploye per SFTP."
            echo "deployed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Merge, aber NICHT von develop (oder develop unbekannt) – Abbruch."
            echo "deployed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: PHP einrichten
        if: steps.check-merge.outputs.deployed == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: composer install --no-dev
        if: steps.check-merge.outputs.deployed == 'true'
        run: composer install --no-dev --optimize-autoloader --no-interaction
        # vendor/ ist gitignored (siehe .gitignore/docs/DEPLOY.md) - landet nur
        # so im Deploy-Payload, nie über Git selbst.

      - name: Server-Cache per SFTP leeren (vor Backup + Deploy)
        if: steps.check-merge.outputs.deployed == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          TARGET="$(printf '%s' "$FTP_TARGET_DIR" | tr -d '[:space:]')"
          # Bewusst SFTP statt "ssh <befehl>": funktioniert auch auf Shared
          # Hosting ohne Shell-Zugang - dieselbe SFTP-Subsystem-Verbindung, die
          # auch die Upload-Action nutzt. cache/** ist vom Upload ausgeschlossen;
          # hier werden NUR die kompilierten Twig-Templates und der Seiten-Cache
          # entfernt, damit kein alter Stand stehen bleibt. Früher wurde der
          # ganze cache/-Ordner gelöscht - samt Backups und Core-Backups, die
          # damit nie länger als bis zum nächsten Deploy überlebten. Beim
          # allerersten Deploy gibt es die Ordner noch nicht -> No-op.
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -e "set sftp:auto-confirm yes; set net:max-retries 3; rm -rf \"$TARGET/cache/twig\"; rm -rf \"$TARGET/cache/pages\"; bye" "sftp://$FTP_SERVER" || true
        shell: bash

      - name: .env auf dem Server anlegen (nur wenn noch keine existiert)
        if: steps.check-merge.outputs.deployed == 'true'
        run: |
          # .env ist gitignored und vom Upload ausgeschlossen – ohne sie gibt es
          # nach dem Erst-Deploy keinen Admin-Login (CMS::ensureSeeded() legt
          # Benutzer nur aus ADMIN_USERS/ADMIN_USERNAME an) und der
          # Backup-Endpunkt bleibt deaktiviert. Deshalb hier einmalig aus den
          # Secrets anlegen. Eine vorhandene .env wird NIE angefasst (dort
          # gepflegte Werte/Logins haben Vorrang).
          TARGET="$(printf '%s' "$FTP_TARGET_DIR" | tr -d '[:space:]')"
          if lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -e "set sftp:auto-confirm yes; set net:max-retries 3; cls -1 \"$TARGET/.env\"; bye" "sftp://$FTP_SERVER" >/dev/null 2>&1; then
            echo ".env existiert bereits auf dem Server – unverändert gelassen."
            exit 0
          fi
          umask 077
          ENVFILE="$(mktemp)"
          {
            echo "# Automatisch beim Erst-Deploy aus GitHub-Secrets angelegt (deploy-staging.yml)."
            echo "BACKUP_TOKEN=$(printf '%s' "$BACKUP_TOKEN" | tr -d '[:space:]')"
            if [ -n "$ADMIN_USERS" ]; then
              echo "ADMIN_USERS=$ADMIN_USERS"
            fi
          } > "$ENVFILE"
          if [ -z "$ADMIN_USERS" ]; then
            echo "::warning::Secret ADMIN_USERS fehlt – .env enthält nur BACKUP_TOKEN. Ohne Admin-Benutzer in data/config.json ist der Admin nach dem Erst-Deploy nicht erreichbar (ADMIN_USERS setzen oder .env auf dem Server ergänzen)."
          fi
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -e "set sftp:auto-confirm yes; set net:max-retries 3; put \"$ENVFILE\" -o \"$TARGET/.env\"; chmod 600 \"$TARGET/.env\"; bye" "sftp://$FTP_SERVER"
          rm -f "$ENVFILE"
          echo ".env auf dem Server angelegt."
        shell: bash

      - name: Sicherung auf dem Server anlegen (vor dem Deploy)
        if: steps.check-merge.outputs.deployed == 'true'
        run: |
          set -e
          : "${BACKUP_URL:?BACKUP_URL-Secret fehlt oder ist leer}"
          : "${BACKUP_TOKEN:?BACKUP_TOKEN-Secret fehlt oder ist leer}"
          BACKUP_URL="$(printf '%s' "$BACKUP_URL" | tr -d '[:space:]')"
          BACKUP_TOKEN="$(printf '%s' "$BACKUP_TOKEN" | tr -d '[:space:]')"
          HTTP_CODE="$(curl -sS --connect-timeout 30 --max-time 120 -o /tmp/backup-response.txt -w '%{http_code}' -X POST \
                "$BACKUP_URL" \
                --data-urlencode "token=$BACKUP_TOKEN" \
                -H "Authorization: Bearer $BACKUP_TOKEN")" || HTTP_CODE=000
          RESPONSE="$(cat /tmp/backup-response.txt 2>/dev/null || true)"
          if [ "$HTTP_CODE" = "200" ]; then
            echo "Backup ok. Antwort: ${RESPONSE}"
          elif [ "$HTTP_CODE" = "404" ] && printf '%s' "$RESPONSE" | grep -q "not configured"; then
            # Code ist da, aber BACKUP_TOKEN fehlt in der .env des Servers –
            # früher lief das als "erster Deploy" durch und es gab bei JEDEM
            # Deploy still kein Backup.
            echo "::warning::Backup NICHT erstellt: auf dem Server fehlt BACKUP_TOKEN in der .env (Backup-Endpunkt deaktiviert). .env ergänzen – Wert identisch zum Secret BACKUP_TOKEN."
          elif [ "$HTTP_CODE" = "404" ]; then
            # Allererster Deploy: auf dem Server liegt noch kein Code, der
            # Backup-Endpunkt existiert dort schlicht noch nicht - nichts zum
            # Sichern da, kein Grund zum Abbrechen. Ein falscher/fehlender
            # Token liefert 403, kein 404 (siehe Admin::runBackup()) - bleibt
            # also weiterhin ein harter Fehler unten.
            echo "::warning::Backup-Endpunkt antwortet mit 404 (vermutlich erster Deploy, noch kein Code auf dem Server) - fahre trotzdem fort. Antwort: ${RESPONSE}"
          else
            echo "::error::Backup-Aufruf fehlgeschlagen (HTTP ${HTTP_CODE}). Antwort: ${RESPONSE:-<keine Antwort>}"
            exit 3
          fi
        shell: bash

      - name: Sicherung als Offsite-Kopie holen (verschlüsselt)
        id: offsite
        if: steps.check-merge.outputs.deployed == 'true'
        run: |
          # Die Sicherung von eben liegt nur auf demselben Server wie die Seite -
          # fällt der Host aus, ist sie mit weg. Deshalb hier herunterladen und
          # als GitHub-Artefakt ablegen (90 Tage). Verschlüsselt mit BACKUP_TOKEN,
          # weil Artefakte öffentlicher Repos für jeden lesbar sind und das Backup
          # personenbezogene Daten (Anfragen) und Admin-Logins enthält.
          # Entschlüsseln/Wiederherstellen: docs/DEPLOY.md -> "Offsite-Kopie".
          # Ein Fehler hier blockiert den Deploy nicht (Warnung statt Abbruch).
          FILE="$(jq -r '.file // empty' /tmp/backup-response.txt 2>/dev/null || true)"
          if ! printf '%s' "$FILE" | grep -Eq '^backup-[0-9]{8}-[0-9]{6}\.zip$'; then
            echo "Keine neue Sicherung auf dem Server (siehe Schritt davor) – Offsite-Kopie übersprungen."
            exit 0
          fi
          TARGET="$(printf '%s' "$FTP_TARGET_DIR" | tr -d '[:space:]')"
          KEY="$(printf '%s' "$BACKUP_TOKEN" | tr -d '[:space:]')"
          export KEY
          mkdir -p /tmp/offsite-raw /tmp/offsite
          if ! lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -e "set sftp:auto-confirm yes; set net:max-retries 3; get \"$TARGET/data/backups/$FILE\" -o /tmp/offsite-raw/$FILE; bye" "sftp://$FTP_SERVER" \
             || ! unzip -tq "/tmp/offsite-raw/$FILE" >/dev/null; then
            echo "::warning::Offsite-Kopie fehlgeschlagen: $FILE konnte nicht (vollständig) heruntergeladen werden. Die Sicherung auf dem Server ist davon unberührt."
            exit 0
          fi
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:KEY \
            -in "/tmp/offsite-raw/$FILE" -out "/tmp/offsite/$FILE.enc"
          rm -rf /tmp/offsite-raw
          echo "file=$FILE.enc" >> "$GITHUB_OUTPUT"
          echo "Offsite-Kopie verschlüsselt: $FILE.enc ($(wc -c < "/tmp/offsite/$FILE.enc" | tr -d ' ') Bytes)"
        shell: bash

      - name: Offsite-Kopie als Artefakt ablegen
        if: steps.offsite.outputs.file != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.offsite.outputs.file }}
          path: /tmp/offsite/${{ steps.offsite.outputs.file }}
          retention-days: 90
          # schon verschlüsselt + gezippt - nochmal komprimieren bringt nichts
          compression-level: 0
          if-no-files-found: warn

      - name: Veraltete Dateien auf dem Server entfernen (nur Core/Layout/Components)
        if: steps.check-merge.outputs.deployed == 'true'
        run: |
          # Der Upload lädt nur hoch, löscht aber nie – Dateien, die im Generator
          # bzw. in der Instanz entfernt wurden (ungenutzte Components/Varianten,
          # umbenannte Core-Dateien), blieben sonst ewig auf dem Server liegen.
          # Gelöscht wird AUSSCHLIESSLICH in den vom Generator verwalteten Bereichen
          # und nur, was dort nicht (mehr) im Repo ist. data/, uploads/, cache/,
          # vendor/ und .env werden nie angefasst.
          set -euo pipefail
          TARGET="$(printf '%s' "$FTP_TARGET_DIR" | tr -d '[:space:]')"
          MANAGED='^(core|themes-and-plugins/(components|headers|footers|topbars|stickybars|cookiebanners|themes))/'
          LFTP="set sftp:auto-confirm yes; set net:max-retries 3; set cmd:fail-exit no"

          git ls-files | grep -E "$MANAGED" | sort -u > /tmp/local.txt || true
          if [ ! -s /tmp/local.txt ] || ! grep -q '^core/' /tmp/local.txt; then
            echo "::warning::Lokale Dateiliste leer/unvollständig – Aufräumen übersprungen."
            exit 0
          fi

          # Remote-Liste (Pfade relativ zum Docroot; Ordner enden auf /)
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -e "$LFTP; cd \"$TARGET\"; find core; find themes-and-plugins; bye" "sftp://$FTP_SERVER" 2>/dev/null \
            | sed 's#^\./##' | grep -E "$MANAGED" | sort -u > /tmp/remote.txt || true

          grep -v '/$' /tmp/remote.txt | comm -23 - /tmp/local.txt > /tmp/stale-files.txt || true
          # Ordner, unter denen lokal gar nichts mehr liegt -> komplett entfernen
          : > /tmp/stale-dirs.txt
          grep '/$' /tmp/remote.txt | while read -r d; do
            awk -v p="$d" 'index($0, p) == 1 { found = 1; exit } END { exit !found }' /tmp/local.txt || echo "$d" >> /tmp/stale-dirs.txt
          done
          # nur oberste veraltete Ordner behalten, Dateien darin nicht einzeln löschen
          sort /tmp/stale-dirs.txt | awk 'NR == 1 || index($0, prev) != 1 { print; prev = $0 }' > /tmp/stale-top.txt
          awk 'NR == FNR { top[NR] = $0; n = NR; next }
               { for (i = 1; i <= n; i++) if (index($0, top[i]) == 1) next; print }' /tmp/stale-top.txt /tmp/stale-files.txt > /tmp/stale-loose.txt

          n_dirs=$(wc -l < /tmp/stale-top.txt | tr -d ' ')
          n_files=$(wc -l < /tmp/stale-loose.txt | tr -d ' ')
          if [ "$n_dirs" -eq 0 ] && [ "$n_files" -eq 0 ]; then
            echo "Nichts zu entfernen – Server entspricht dem Repo."
            exit 0
          fi
          if [ $(( n_dirs + n_files )) -gt 400 ]; then
            echo "::error::Ungewöhnlich viel zu löschen ($n_dirs Ordner, $n_files Dateien) – Abbruch zur Sicherheit, bitte prüfen."
            sed 's/^/  /' /tmp/stale-top.txt /tmp/stale-loose.txt | head -50
            exit 1
          fi
          echo "Entferne $n_dirs Ordner und $n_files Dateien:"
          sed 's/^/  - /' /tmp/stale-top.txt /tmp/stale-loose.txt

          {
            echo "cd \"$TARGET\""
            while read -r d; do echo "rm -rf \"${d%/}\""; done < /tmp/stale-top.txt
            while read -r f; do echo "rm \"$f\""; done < /tmp/stale-loose.txt
            # Upload-Gedächtnis zurücksetzen: sonst würde eine gelöschte Datei, die
            # später unverändert zurückkommt, nie wieder hochgeladen.
            echo "rm -f .sftp_upload_action_hashes"
          } > /tmp/cleanup.lftp
          # Zugangsdaten nicht in die Datei: Verbindung wie in den anderen Schritten,
          # Befehle per source (lftp erlaubt -f nicht zusammen mit -u/URL).
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -e "$LFTP; source /tmp/cleanup.lftp; bye" "sftp://$FTP_SERVER"
        shell: bash

      - name: SFTP-Deploy (nur bei develop→staging-Merge)
        if: steps.check-merge.outputs.deployed == 'true'
        uses: wangyucode/sftp-upload-action@v3
        with:
          host: ${{ env.FTP_SERVER }}
          username: ${{ env.FTP_USERNAME }}
          password: ${{ env.FTP_PASSWORD }}
          port: 22
          # Web-Root der Subdomain (per DCP gemappter Zielordner), absoluter
          # Pfad aus Secret FTP_TARGET_DIR.
          localDir: '.'
          remoteDir: ${{ env.FTP_TARGET_DIR }}
          # Inkremental: nur geänderte Dateien übertragen (die Action
          # verwaltet dazu .sftp_upload_action_hashes auf dem Server).
          forceUpload: false
          concurrency: 4
          # Nur Code deployen. data/config.json, data/content.json, uploads/
          # und cache/ sind auf dem Server live (über den Admin-Bereich
          # dieser CMS-Instanz gepflegt) - ein Deploy darf sie nie
          # überschreiben oder löschen, siehe docs/DEPLOY.md.
          # Muster laufen über Pythons fnmatch, dort passt "*" auch auf "/":
          # deshalb KEIN "*.md" - das würde core/MANUAL.md und die
          # CHANGELOG.md-Dateien treffen, die der Admin anzeigt.
          exclude: |
            .git,
            .git/**,
            .github/**,
            .gitignore,
            .env,
            .env.*,
            .my-credentials,
            .layout-sync.json,
            README.md,
            .DS_Store,
            composer.json,
            composer.lock,
            data/config.json,
            data/content.json,
            data/inquiries.json,
            data/backups/**,
            data/.history/**,
            uploads/**,
            cache/**
